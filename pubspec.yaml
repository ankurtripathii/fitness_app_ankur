name: fitapp
description: Capstone - Fitness Tracker with Firebase, API, Animations & State Management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  provider: ^6.1.1
  http: ^1.2.1
  intl: ^0.20.2
  fl_chart: ^1.2.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.2.3
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
